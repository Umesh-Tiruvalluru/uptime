name: betteruptime

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: monitoring
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: monitoring
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitoring -d monitoring"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-m", "8222"]
    ports:
      - "4222:4222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8222/healthz > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://monitoring:monitoring@postgres:5432/monitoring?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    command: ["postgresql://monitoring:monitoring@postgres:5432/monitoring?sslmode=disable", "up"]
    restart: "no"

  api:
    build:
      context: .
      target: api
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://monitoring:monitoring@postgres:5432/monitoring?sslmode=disable
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
      GIN_MODE: release
    depends_on:
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgresql://monitoring:monitoring@postgres:5432/monitoring?sslmode=disable
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  postgres_data:
