zerops:
  - setup: api
    build:
      base: go@1
      buildCommands:
        - mkdir -p bin
        - go build -ldflags="-s -w" -o bin/api ./cmd/api
        - go install github.com/pressly/goose/v3/cmd/goose@v3.26.0
        - cp $(go env GOPATH)/bin/goose bin/goose
      deployFiles:
        - bin/api
        - bin/goose
        - migrations
      cache:
        - .go/pkg/mod
    run:
      base: go@1
      envVariables:
        DATABASE_URL: ${postgresql_connectionString}
        NATS_URL: nats://nats:4222
        PORT: "8080"
        GIN_MODE: release
        JWT_SECRET: change-me-to-a-long-random-string
      ports:
        - port: 8080
          httpSupport: true
          zeropsSubdomain: api
      initCommands:
        - ./bin/goose -dir ./migrations postgres "$DATABASE_URL" up
      start: ./bin/api

  - setup: worker
    build:
      base: go@1
      buildCommands:
        - mkdir -p bin
        - go build -ldflags="-s -w" -o bin/worker ./cmd/worker
      deployFiles:
        - bin/worker
      cache:
        - .go/pkg/mod
    run:
      base: go@1
      envVariables:
        DATABASE_URL: ${postgresql_connectionString}
        NATS_URL: nats://nats:4222
      start: ./bin/worker

  - setup: frontend
    build:
      base: nodejs@24
      os: ubuntu
      buildCommands:
        - |
          cd frontend
          npm ci
          npm run build
      deployFiles:
        - frontend/package.json
        - frontend/node_modules
        - frontend/.next
        - frontend/public
    run:
      base: nodejs@24
      os: ubuntu
      envVariables:
        PORT: "3000"
        HOSTNAME: 0.0.0.0
        NEXT_PUBLIC_API_URL: https://api-2dcd.prg1.zerops.app
      ports:
        - port: 3000
          httpSupport: true
      start: cd frontend && npm run start
