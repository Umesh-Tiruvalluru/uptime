zerops:
  project:
    name: Uptime-App

  - services:
      - id: postgres
        type: postgresql@17
        mode: HA
        priority: 1

  - services:
      - id: nats
        image: nats:2.10-alpine
        ports:
          - port: 4222
            protocol: TCP

  - services:
      - id: migrate
        buildFrom:
          dockerfile: Dockerfile
          context: .
          target: migrate
        run:
          command: ["up"]
          maxRestarts: 1
        envSecrets:
          DATABASE_URL: ${postgres_connection_string}

  - services:
      - id: api
        buildFrom:
          dockerfile: Dockerfile
          context: .
          target: api
        ports:
          - port: 8080
            protocol: HTTP
        env:
          PORT: "8080"
          GIN_MODE: release
          NATS_URL: nats://nats:4222
        envSecrets:
          DATABASE_URL: ${postgres_connection_string}
          JWT_SECRET: ${jwt_secret}
        healthCheck:
          http:
            port: 8080
            path: /api/status
            interval: 10
            timeout: 5
        scale:
          minContainers: 1
          maxContainers: 3

  - services:
      - id: worker
        buildFrom:
          dockerfile: Dockerfile
          context: .
          target: worker
        envSecrets:
          DATABASE_URL: ${postgres_connection_string}
          RESEND_API_KEY: ${resend_api_key}
          RESEND_FROM_EMAIL: ${resend_from_email}
        env:
          NATS_URL: nats://nats:4222
        scale:
          minContainers: 1
          maxContainers: 4

  - services:
      - id: frontend
        buildFrom:
          dockerfile: frontend/Dockerfile
          context: frontend
          buildArgs:
            NEXT_PUBLIC_API_URL: https://${public_hostname}
        ports:
          - port: 3000
            protocol: HTTP
        scale:
          minContainers: 1
          maxContainers: 3
