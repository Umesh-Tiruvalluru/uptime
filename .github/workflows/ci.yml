name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-go:
    name: Go test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: monitoring
          POSTGRES_USER: monitoring
          POSTGRES_PASSWORD: monitoring
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://monitoring:monitoring@localhost:5432/monitoring?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true
      - run: go test ./...

  test-frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  deploy-production:
    name: Deploy to Zerops
    runs-on: ubuntu-latest
    needs: [test-go, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Validate Zerops recipe
        run: |
          curl -fsSL https://zerops.io/api/client/zcli.sh | bash -s -- --version
          zcli --version
      - name: Push to Zerops
        env:
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
          ZEROPS_PROJECT_ID: ${{ secrets.ZEROPS_PROJECT_ID }}
        run: zcli push --projectId "$ZEROPS_PROJECT_ID" --token "$ZEROPS_TOKEN"
